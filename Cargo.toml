[workspace]
members = [
    "crates/rvm-types",
    "crates/rvm-core",
    "crates/rvm-compiler",
    "crates/rvm-validator",
    "crates/rvm-tracker",
    "crates/rvm-ai",
    "crates/rvm-tui",
    "crates/rvm-cli",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["RVM Project Team"]
license = "MIT"
repository = "https://github.com/rvm-project/rvm"
description = "Resume Version Manager - Git-like version control for resumes"

[workspace.dependencies]
# Shared across crates - single source of truth for versions
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Diffing
similar = { version = "2", features = ["text"] }

# PDF analysis
lopdf = "0.34"

# Testing
tempfile = "3"
assert_cmd = "2"
predicates = "3"

# Internal crates
rvm-types = { path = "crates/rvm-types" }
rvm-core = { path = "crates/rvm-core" }
rvm-compiler = { path = "crates/rvm-compiler" }
rvm-validator = { path = "crates/rvm-validator" }
rvm-tracker = { path = "crates/rvm-tracker" }
rvm-ai = { path = "crates/rvm-ai" }
rvm-tui = { path = "crates/rvm-tui" }

[profile.release]
lto = true
codegen-units = 1
strip = true
